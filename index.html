<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#050505">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HeldRoom">
  <meta name="description" content="HeldRoom, escape room horror cinematografica ottimizzata per smartphone.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/app-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/app-icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="reboot.css">
  <title>HeldRoom | Escape the Darkness</title>
</head>
<body>
  <main class="app" id="app">
    <header class="appbar">
      <div class="brand">HELDROOM<small>ESCAPE THE DARKNESS</small></div>
      <div class="fearCompact"><span>PAURA</span><b id="fearValue">28%</b><i><em id="fearBar"></em></i></div>
      <button id="sound" class="iconBtn" aria-label="Audio">🔊</button>
    </header>

    <section class="gameview" aria-label="Atrio della casa">
      <div class="scene" id="scene"></div>
      <div class="rain"></div>
      <div class="lightning" id="lightning"></div>

      <section class="roomHud">
        <p class="chapter">CAPITOLO I</p>
        <h1>ATRIO</h1>
        <p class="roomLine">Prima stanza della casa.</p>
        <p class="warningLine">La casa non dimentica.</p>
      </section>

      <section class="timerChip"><small>TEMPO</small><strong id="timer">60:00</strong></section>

      <button class="hotspot hs-door" data-type="door" aria-label="Esamina la porta"></button>
      <button class="hotspot hs-doll" data-type="doll" aria-label="Esamina la bambola"></button>
      <button class="hotspot hs-clock" data-type="clock" aria-label="Esamina l'orologio"></button>
      <button class="hotspot hs-portrait" data-type="portrait" aria-label="Esamina il ritratto"></button>

      <button id="flash" class="flash" aria-label="Torcia">▰</button>

      <section class="objectiveCard">
        <small>OBIETTIVO</small>
        <strong id="objectiveText">Esplora l’atrio e trova il primo indizio.</strong>
      </section>
    </section>

    <nav class="bottomNav" aria-label="Navigazione gioco">
      <button class="navItem active" data-sheet="game"><span>⌂</span><small>Gioca</small></button>
      <button class="navItem" data-sheet="diary"><span>▤</span><small>Diario</small></button>
      <button class="navItem" data-sheet="inventory"><span>◇</span><small>Oggetti</small></button>
      <button class="navItem" data-sheet="help"><span>?</span><small>Aiuti</small></button>
    </nav>
  </main>

  <div id="sheet" class="sheet" aria-hidden="true">
    <button id="sheetBackdrop" class="sheetBackdrop" aria-label="Chiudi"></button>
    <section class="sheetPanel">
      <div class="sheetHandle"></div>
      <button id="closeSheet" class="sheetClose">×</button>
      <div id="sheetContent"></div>
    </section>
  </div>

  <div id="modal" class="modal" aria-hidden="true">
    <div class="modalbox">
      <button id="closeModal" class="modalClose">×</button>
      <p class="eyebrow">ESAMINA</p>
      <h2 id="modalTitle"></h2>
      <div class="inspectArt" id="inspectArt"></div>
      <p id="modalText"></p>
      <button id="modalAction" class="primaryAction">Continua</button>
    </div>
  </div>

  <script src="reboot.js"></script>
</body>
</html>
