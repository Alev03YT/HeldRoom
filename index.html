<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#030403">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>HeldRoom — L'Archivio Proibito</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="reboot.css">
</head>
<body>
  <div class="game-shell">
    <header class="hud-top">
      <div class="brand"><strong>HELDROOM</strong><small>L'ARCHIVIO PROIBITO</small></div>
      <div class="hud-status">
        <div class="fear"><span>TENSIONE</span><b id="fearValue">18%</b><i><u id="fearBar"></u></i></div>
        <button id="sound" class="round-button" aria-label="Audio">🔊</button>
      </div>
    </header>

    <main class="stage">
      <section id="scene" class="scene" aria-label="Studio del professor Voss">
        <div class="room-image"></div>
        <div class="cold-light"></div>
        <div class="warm-light"></div>
        <div class="rain"></div>
        <div class="grain"></div>
        <div class="vignette"></div>

        <section class="room-label">
          <small>CAPITOLO I</small>
          <h1>LO STUDIO</h1>
          <p>L'ultimo luogo in cui Voss fu visto vivo.</p>
        </section>

        <section class="timer-pill"><small>TEMPO</small><strong id="timer">60:00</strong></section>

        <button class="hotspot desk" data-type="desk" aria-label="Esamina la scrivania"></button>
        <button class="hotspot globe" data-type="globe" aria-label="Esamina il globo"></button>
        <button class="hotspot cabinet" data-type="cabinet" aria-label="Esamina la vetrina"></button>
        <button class="hotspot door" data-type="door" aria-label="Esamina la porta"></button>

        <button id="flash" class="flash" aria-label="Lanterna">▰</button>

        <section class="mission-strip">
          <div><small>OBIETTIVO</small><strong id="objectiveText">Cerca il primo indizio sulla scrivania.</strong></div>
          <button id="hintQuick" class="hint-button" aria-label="Aiuto">?</button>
        </section>

        <section class="inventory-dock">
          <div class="inventory-head"><span>INVENTARIO</span><small id="inventoryCount">1 / 6</small></div>
          <div id="inventorySlots" class="slots"></div>
        </section>
      </section>
    </main>

    <nav class="app-nav" aria-label="Navigazione">
      <button class="active" data-panel="game"><span>◉</span><small>Gioca</small></button>
      <button data-panel="diary"><span>▤</span><small>Diario</small></button>
      <button data-panel="inventory"><span>▦</span><small>Oggetti</small></button>
      <button data-panel="hints"><span>?</span><small>Aiuti</small></button>
      <button data-panel="settings"><span>⚙</span><small>Altro</small></button>
    </nav>
  </div>

  <div id="sheet" class="sheet" aria-hidden="true">
    <button id="sheetBackdrop" class="sheet-backdrop" aria-label="Chiudi"></button>
    <section class="sheet-panel">
      <div class="grabber"></div>
      <header><h2 id="sheetTitle"></h2><button id="closeSheet" class="round-button">×</button></header>
      <div id="sheetBody"></div>
    </section>
  </div>

  <div id="inspect" class="inspect" aria-hidden="true">
    <button id="inspectBackdrop" aria-label="Chiudi"></button>
    <article>
      <button id="closeInspect" class="close">×</button>
      <small>ESAMINA</small>
      <h2 id="inspectTitle"></h2>
      <div id="inspectArt" class="inspect-art"></div>
      <p id="inspectText"></p>
      <div id="inspectActions"></div>
    </article>
  </div>

  <script src="reboot.js"></script>
</body>
</html>
