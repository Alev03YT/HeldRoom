<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050603">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>HeldRoom — Lo Studio del Professore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="reboot.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><strong>HELDROOM</strong><small>THE FORBIDDEN ARCHIVE</small></div>
      <div class="status">
        <div class="fear"><span>TENSIONE</span><b id="fearValue">22%</b><i><u id="fearBar"></u></i></div>
        <button id="sound" class="icon-btn" aria-label="Audio">🔊</button>
      </div>
    </header>

    <main class="play-layout">
      <section id="scene" class="scene" aria-label="Lo studio del professor Voss">
        <div class="room-image"></div>
        <div class="room-light"></div>
        <div class="rain"></div>
        <div class="grain"></div>

        <div class="scene-topline">
          <section class="room-title">
            <small>CAPITOLO I</small>
            <h1>LO STUDIO</h1>
            <p>L’archivio privato del professor Voss.</p>
          </section>
          <section class="timer-box"><small>TEMPO</small><strong id="timer">60:00</strong></section>
        </div>

        <button class="hotspot desk" data-type="desk" aria-label="Esamina la scrivania"></button>
        <button class="hotspot globe" data-type="globe" aria-label="Esamina il globo"></button>
        <button class="hotspot cabinet" data-type="cabinet" aria-label="Esamina la vetrina"></button>
        <button class="hotspot door" data-type="door" aria-label="Esamina la porta sigillata"></button>
        <button id="flash" class="flash" aria-label="Lanterna">▰</button>
      </section>

      <aside class="side-panel">
        <section class="objective-card">
          <small>OBIETTIVO</small>
          <strong id="objectiveText">Trova i tre sigilli e apri la porta dell’archivio.</strong>
          <button id="hintQuick" class="secondary-btn">Chiedi un aiuto</button>
        </section>

        <section class="progress-card">
          <div><small>INDIZI</small><b id="clueCount">0 / 4</b></div>
          <div><small>SIGILLI</small><b id="sealCount">0 / 3</b></div>
        </section>

        <section class="inventory-card">
          <div class="section-head"><span>INVENTARIO</span><small id="inventoryCount">3 / 6</small></div>
          <div id="inventorySlots" class="slots"></div>
        </section>
      </aside>
    </main>

    <nav class="bottom-nav" aria-label="Navigazione">
      <button class="active" data-panel="game"><span>◉</span><small>Gioca</small></button>
      <button data-panel="diary"><span>▤</span><small>Diario</small></button>
      <button data-panel="inventory"><span>▦</span><small>Oggetti</small></button>
      <button data-panel="hints"><span>?</span><small>Aiuti</small></button>
      <button data-panel="settings"><span>⚙</span><small>Altro</small></button>
    </nav>
  </div>

  <div id="sheet" class="sheet" aria-hidden="true">
    <button id="sheetBackdrop" class="sheet-backdrop" aria-label="Chiudi"></button>
    <section class="sheet-card">
      <div class="grabber"></div>
      <header><h2 id="sheetTitle"></h2><button id="closeSheet" class="icon-btn">×</button></header>
      <div id="sheetBody"></div>
    </section>
  </div>

  <div id="inspect" class="inspect" aria-hidden="true">
    <button id="inspectBackdrop" aria-label="Chiudi"></button>
    <article>
      <button id="closeInspect" class="close">×</button>
      <small>ESAMINA</small>
      <h2 id="inspectTitle"></h2>
      <div id="inspectArt" class="inspect-art"></div>
      <p id="inspectText"></p>
      <div id="inspectActions"></div>
    </article>
  </div>

  <script src="reboot.js"></script>
</body>
</html>
